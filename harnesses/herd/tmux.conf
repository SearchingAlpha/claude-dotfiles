# tmux settings for Claude Code sessions started with `herd new`.
# Install: ln -sfn ~/claude-dotfiles/harnesses/herd/tmux.conf ~/.config/tmux/tmux.conf
# Reload a running server: tmux source-file ~/.config/tmux/tmux.conf

# The mouse wheel scrolls back through a pane's output (q or Esc to leave).
# To select text with the terminal's own selection, hold Shift while dragging.
set -g mouse on

# Lines of scrollback per pane (tmux's default is 2000); applies to new panes.
set -g history-limit 50000

# Pass 24-bit colour through: Claude Code draws in truecolor, and without this
# tmux rounds every colour to the nearest of 256.
set -as terminal-features ',xterm-256color:RGB'
